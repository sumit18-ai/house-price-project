services:
  # Python Flask Backend Service
  - type: web
    name: house-price-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/train.py
    startCommand: gunicorn --dir backend wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health

  # React Frontend Static Site Service
  - type: web
    name: house-price-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: house-price-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
